name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=purple_clay --cov-report=term-missing
    
    - name: Run demos (quick test)
      run: |
        python -c "from purple_clay.examples import emergent_spacetime_demo; emergent_spacetime_demo(16, 10)"
        python -c "from purple_clay.examples import quantum_flow_demo; quantum_flow_demo(4, 2)"
